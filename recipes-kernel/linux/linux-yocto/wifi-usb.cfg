# Basic USB support (if not already enabled in the BSP configuration)
CONFIG_USB_SUPPORT=y
CONFIG_USB=y

# Ralink RT3070 driver (uses the rt2x00 infrastructure)
CONFIG_WLAN_VENDOR_RALINK=y
CONFIG_RT2X00=m
CONFIG_RT2800USB=m
CONFIG_RT2800USB_RT35XX=y
CONFIG_RT2800USB_RT53XX=y
CONFIG_RT2800USB_UNKNOWN=y

# Atheros AR9271 driver (new)
CONFIG_WLAN_VENDOR_ATH=y
CONFIG_ATH9K_HTC=m

