WIFI_IF=wlan0
MESH_IF=bat0
APUPEER_PREFIX=$WIFI_IF.w29-up
SSID=APuP
# Comment STAWPA to use an open network.
#STAWPA=ChangeMe123
WIFI_CHANNEL=4
# 1: write noscan=1 with HT40, so hostapd does not fall back to 20 MHz on overlapping BSSes; skipped if hostapd has no noscan.
NOSCAN=1
# "auto": driver-managed power; "fixed 2000": request 20 dBm; "limit 2000": cap at 20 dBm (mBm = 100 * dBm; hardware/regulatory limits apply).
TX_POWER="auto"
# Comment NODE_IP to derive it from the last two Wi-Fi MAC octets.
#NODE_IP=172.29.14.83
NET_PREFIX=172.29
ORIG_INTERVAL=250
COUNTRY_CODE=US
# Comment HOTSPOT_IP to disable hotspot addressing, DHCP, NAT and forwarding setup.
HOTSPOT_IP=192.168.10.1
HOTSPOT_CIDR=192.168.10.1/24
HOTSPOT_NETWORK=192.168.10.0/24
DHCP_RANGE=192.168.10.100,192.168.10.249,255.255.255.0,12h
